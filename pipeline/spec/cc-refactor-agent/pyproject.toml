[project]
name = "cc-agent"
version = "0.1.0"
description = "Claude Code agent for Lean 4 proof optimization"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "pyyaml>=6.0.3",
    "openai==2.31.0",
    "ms_swift==3.12.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "vllm==0.11.0",
    "faiss-cpu==1.13.0",
    "leanclient==0.9.2",
    "easydict==1.13"
]

[project.scripts]
cc-golf = "scripts.run_golf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
