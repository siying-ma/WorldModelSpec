# Example configuration for cc_agent proof optimization.
#
# NOTE: nothing reads this file — the Fire CLI is flag-driven. It is kept as a
# reference for the equivalent command-line invocation shown below.
#
# Usage:
#   python -m scripts.run_golf run \
#     --jsonl-file eval/test_analysis.jsonl \
#     --project-root workspace/analysis \
#     --output-dir results/golf_run_001 \
#     --max-turns 40 \
#     --parallel --max-workers 4

# Lean project root (relative to the repo root, or absolute)
project_root: workspace/analysis

# Input JSONL file (relative to project_root or absolute)
jsonl_file: eval/test_analysis.jsonl

# Output directory for results
output_dir: results/golf_run_001

# Max turns per Claude session (CLI default: 20)
max_turns: 40

# Parallel execution settings
parallel: true
max_workers: 4

# Optional: only process specific theorem(s)
# filter_name: "IsElementary.measure_le_cover_sum"

# Optional: limit number of tasks
# max_tasks: 10
