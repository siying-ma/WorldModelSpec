[project]
name = "traffic-spec-agent"
version = "0.1.0"
description = "Autoformalize natural-language traffic law into Lean 4 specifications over a law-facing ontology"
requires-python = ">=3.11"
dependencies = [
    "fire>=0.6.0",
    "openai>=1.66",
    "jsonschema>=4.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "recorded", "scripts"]
